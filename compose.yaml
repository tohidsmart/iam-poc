# Trust boundaries:
#   public - reachable from the host: Hydra public API and the login UI
#   admin  - Hydra admin API; only services that must call it are attached
#   db     - Postgres; only Hydra and its migration job are attached
# Docker networks isolate containers, not ports: anything sharing a network with
# Hydra can reach both 4444 and 4445. The control here is that 4445 is never
# published and untrusted containers stay off `admin`.
services:
  postgresd:
    image: postgres:16
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hydra"]
      interval: 1s
      timeout: 30s
      retries: 30
    environment:
      - PGUSER=hydra
      - POSTGRES_USER=hydra
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=hydra
    secrets:
      - postgres_password
    networks:
      - db
    volumes:
      - hydra-pgdata:/var/lib/postgresql/data

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    pull_policy: missing
    volumes:
      - type: bind
        source: ./ory-hydra/config
        target: /etc/config/hydra
        read_only: true
    secrets:
      # mounted under /run/secrets/
      - source: hydra_secrets
        target: hydra.secrets.yml
      - source: hydra_dsn
        target: hydra.dsn.yml
    command: migrate -c /etc/config/hydra/hydra.yml -c /run/secrets/hydra.secrets.yml -c /run/secrets/hydra.dsn.yml sql up -e --yes
    restart: on-failure
    networks:
      - db
    depends_on:
      postgresd:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v26.2.0
    pull_policy: missing
    volumes:
      - type: bind
        source: ./ory-hydra/config
        target: /etc/config/hydra
        read_only: true
    secrets:
      # mounted under /run/secrets/
      - source: hydra_secrets
        target: hydra.secrets.yml
      - source: hydra_dsn
        target: hydra.dsn.yml
    ports:
      - "127.0.0.1:4444:4444" # public API only; admin (4445) is deliberately not published
    # --dev allows the http:// issuer for local use. Not for production.
    command: serve -c /etc/config/hydra/hydra.yml -c /run/secrets/hydra.secrets.yml -c /run/secrets/hydra.dsn.yml all --dev
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    networks:
      - public
      - admin
      - db

  # One-shot job: registers the OAuth2 clients in ory-hydra/clients with Hydra.
  # The Hydra image has no shell, so a small curl image runs the script.
  client-bootstrap:
    image: curlimages/curl:8.11.1
    environment:
      - HYDRA_ADMIN_URL=http://hydra:4445
    volumes:
      - type: bind
        source: ./ory-hydra/clients
        target: /clients
        read_only: true
      - type: bind
        source: ./scripts/register-clients.sh
        target: /register-clients.sh
        read_only: true
    entrypoint: ["sh", "/register-clients.sh"]
    restart: on-failure
    networks:
      - admin
    depends_on: [hydra]

  login:
    build: ./login
    environment:
      - HYDRA_ADMIN_URL=http://hydra:4445
      - COOKIE_SECRET_FILE=/run/secrets/login_cookie_secret
      # POC shortcut: the stack is plain HTTP locally, so cookies cannot be Secure.
      - COOKIE_SECURE=false
    volumes:
      # Seeded users are data, not code: change them without rebuilding the image.
      - type: bind
        source: ./login/config
        target: /app/config
        read_only: true
    secrets:
      - login_cookie_secret
    ports:
      - "127.0.0.1:3000:3000"
    # Hardening: nothing writable, no capabilities, no privilege escalation.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - public
      - admin
    depends_on:
      hydra:
        condition: service_started
      # Not a runtime dependency. It makes `docker compose up --wait` report
      # ready only once the demo client exists, and tolerate the job exiting.
      client-bootstrap:
        condition: service_completed_successfully

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  hydra_secrets:
    file: ./secrets/hydra.secrets.yml
  hydra_dsn:
    file: ./secrets/hydra.dsn.yml
  login_cookie_secret:
    file: ./secrets/login_cookie_secret

volumes:
  hydra-pgdata:

networks:
  public:
  admin:
    internal: true
  db:
    internal: true
