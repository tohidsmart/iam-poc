# Trust boundaries:
#   public - reachable from the host: Hydra's public API, the login UI, and the
#            demo client and API
#   admin  - Hydra's admin API; only services that must call it are attached
#   db     - Postgres; only Hydra and its migration job are attached
# Hydra's admin API listens only on its `admin` network interface (see
# SERVE_ADMIN_HOST below), so a container that is on `public` alone cannot
# reach port 4445 at all. It is also never published to the host.
services:
  postgresd:
    image: postgres:16
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hydra"]
      interval: 1s
      timeout: 30s
      retries: 30
    environment:
      - PGUSER=hydra
      - POSTGRES_USER=hydra
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=hydra
    secrets:
      - postgres_password
    networks:
      - db
    volumes:
      - hydra-pgdata:/var/lib/postgresql/data

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    pull_policy: missing
    volumes:
      - type: bind
        source: ./ory-hydra/config
        target: /etc/config/hydra
        read_only: true
    secrets:
      # mounted under /run/secrets/
      - source: hydra_secrets
        target: hydra.secrets.yml
      - source: hydra_dsn
        target: hydra.dsn.yml
    command: migrate -c /etc/config/hydra/hydra.yml -c /run/secrets/hydra.secrets.yml -c /run/secrets/hydra.dsn.yml sql up -e --yes
    restart: on-failure
    networks:
      - db
    depends_on:
      postgresd:
        condition: service_healthy

  hydra:
    image: oryd/hydra:v26.2.0
    pull_policy: missing
    volumes:
      - type: bind
        source: ./ory-hydra/config
        target: /etc/config/hydra
        read_only: true
    secrets:
      # mounted under /run/secrets/
      - source: hydra_secrets
        target: hydra.secrets.yml
      - source: hydra_dsn
        target: hydra.dsn.yml
    ports:
      - "127.0.0.1:4444:4444" # public API only; admin (4445) is deliberately not published
    # --dev allows the http:// issuer for local use. Not for production.
    command: serve -c /etc/config/hydra/hydra.yml -c /run/secrets/hydra.secrets.yml -c /run/secrets/hydra.dsn.yml all --dev
    restart: unless-stopped
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      # Bind the admin API to the admin network's interface only. Without this
      # Hydra listens on every interface and any container sharing `public`
      # with it could call the unauthenticated admin API.
      - SERVE_ADMIN_HOST=hydra-admin
    networks:
      public:
      admin:
        aliases:
          - hydra-admin
      db:

  # One-shot job: registers the OAuth2 clients in ory-hydra/clients with Hydra.
  # The Hydra image has no shell, so a small curl image runs the script.
  client-bootstrap:
    image: curlimages/curl:8.11.1
    environment:
      - HYDRA_ADMIN_URL=http://hydra-admin:4445
    volumes:
      - type: bind
        source: ./ory-hydra/clients
        target: /clients
        read_only: true
      - type: bind
        source: ./scripts/register-clients.sh
        target: /register-clients.sh
        read_only: true
    entrypoint: ["sh", "/register-clients.sh"]
    restart: on-failure
    networks:
      - admin
    depends_on: [hydra]

  login:
    build: ./login
    environment:
      - HYDRA_ADMIN_URL=http://hydra-admin:4445
      - COOKIE_SECRET_FILE=/run/secrets/login_cookie_secret
      # POC shortcut: the stack is plain HTTP locally, so cookies cannot be Secure.
      - COOKIE_SECURE=false
    volumes:
      # Seeded users are data, not code: change them without rebuilding the image.
      - type: bind
        source: ./login/config
        target: /app/config
        read_only: true
    secrets:
      - login_cookie_secret
    ports:
      - "127.0.0.1:3000:3000"
    # Hardening: nothing writable, no capabilities, no privilege escalation.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - public
      - admin
    depends_on:
      hydra:
        condition: service_started
      # Not a runtime dependency. It makes `docker compose up --wait` report
      # ready only once the demo client exists, and tolerate the job exiting.
      client-bootstrap:
        condition: service_completed_successfully

  # Demo resource server: an API that accepts Hydra access tokens. It is ours,
  # so it sits inside the trust boundary, and it needs the admin network for
  # one thing: token introspection. Production would give it a proxy exposing
  # only that route, or switch to JWT access tokens it can verify offline.
  resource-server:
    build: ./resource-server
    environment:
      - ROLE=api
      - HYDRA_ADMIN_URL=http://hydra-admin:4445
    ports:
      - "127.0.0.1:4000:4000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - public
      - admin
    depends_on: [hydra]

  # Demo OAuth2 client: stands in for a third-party app. It is outside the
  # trust boundary: `public` only, so it can use Hydra's public API and the
  # resource server, and nothing else. Open http://127.0.0.1:5555.
  demo-client:
    build: ./resource-server
    environment:
      - ROLE=client
      - PORT=5555
      - CLIENT_ID=demo-app
      - BASE_URL=http://127.0.0.1:5555
      # Front channel: where the user's browser reaches Hydra.
      - HYDRA_BROWSER_URL=http://127.0.0.1:4444
      # Back channel: where this container reaches Hydra's token endpoint.
      - HYDRA_PUBLIC_URL=http://hydra:4444
      - API_URL=http://resource-server:4000
      - API_BROWSER_URL=http://127.0.0.1:4000
    ports:
      - "127.0.0.1:5555:5555"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5555/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - public
    depends_on: [hydra, resource-server]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  hydra_secrets:
    file: ./secrets/hydra.secrets.yml
  hydra_dsn:
    file: ./secrets/hydra.dsn.yml
  login_cookie_secret:
    file: ./secrets/login_cookie_secret

volumes:
  hydra-pgdata:

networks:
  public:
  admin:
    internal: true
  db:
    internal: true
